<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <!-- PyScript JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <title> Official Club Member List </title>

<style>
    body {
        background-image: url(https://i.pinimg.com/1200x/16/df/c7/16dfc7f97c99b6aeec9d8e5e64d317c5.jpg);
        background-size: 150%;
        background-attachment: fixed;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;   
    } 
    h1 {
        color: #3580ab;
        font-size: 28px;
    }

    p {
        color: #3580ab;
        font-size: 18px;
    }

    input[type="text"] {
        padding: 12px;
        width: 250px;
        margin: 8px;
        border: 1px solid #a78bfa;
        border-radius: 8px;
        background-color: #5fa5cd;
        color: white;
    }

    input[type="button"] {
        padding: 12px 25px;
        margin: 15px;
        background-color: #8cbad4;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

        #output {
        margin: 20px auto;
        font-size: 16px;
        font-weight: bold;
        background-color: #5fa5cd;
        color: #ddd6fe;
        padding: 25px;
        border-radius: 12px;
        line-height: 1.8;
    }
</style>
</head>

<body>

    <h1>
        Student Membership Renewal SY '26 - '27
    </h1>

    <p>
        Club Renewal for Cosmic Writer's Guild ! 
    </p>
      <input type="text" id="first_name" placeholder="Enter your first name"><br>
        <input type="text" id="last_name" placeholder="Enter your last name"><br>
        <input type="button" py-click="student_members" value="Add student">

    <div id="output"></div>
    <py-script src="ofcmemb.py"></py-script>

</body>
</html>
